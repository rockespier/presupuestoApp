name: 📦 Generate .NET Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🏗️ Build Release
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        env:
         DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
         LC_ALL: en_US.UTF-8
         LANG: en_US.UTF-8

      - name: 📁 Create release artifact
        run: |
          dotnet publish src/PresupuestoFamiliarApp.csproj \
            --configuration Release \
            --no-build \
            --output ./publish
          cd publish
          zip -r ../presupuesto-app.zip .
        
      - name: 📝 Build changelog
        id: build_changelog
        continue-on-error: true
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: "release-changelog-builder-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog || format('Release {0}', github.ref_name) }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: presupuesto-app.zip
