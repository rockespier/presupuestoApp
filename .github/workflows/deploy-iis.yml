name: Deploy PresupuestoFamiliarApp to IIS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PUBLISH_PATH: './publish'
  IIS_SITE_NAME: 'PresupuestoFamiliarApp'
  IIS_APP_POOL: 'PresupuestoFamiliarAppPool'
  IIS_PHYSICAL_PATH: 'C:\inetpub\wwwroot\presupuesto.gestionaminegocio.com'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Verify dotnet installation
      shell: powershell
      run: |
        Write-Host "Verifying .NET SDK installation..." -ForegroundColor Cyan
        dotnet --version
        Write-Host "SDK version: $(dotnet --version)" -ForegroundColor Green
      
    - name: Restore dependencies
      shell: powershell
      run: |
        Write-Host "Restoring dependencies..." -ForegroundColor Cyan
        dotnet restore
      working-directory: .
      
    - name: Build
      shell: powershell
      run: |
        Write-Host "Building application..." -ForegroundColor Cyan
        dotnet build --configuration Release --no-restore
      working-directory: .
      
    - name: Run tests (if available)
      shell: powershell
      run: |
        Write-Host "Checking for test projects..." -ForegroundColor Cyan
        $testProjects = Get-ChildItem -Path . -Filter "*.Tests.csproj" -Recurse
        
        if ($testProjects.Count -eq 0) {
          Write-Host "No test projects found - skipping tests" -ForegroundColor Yellow
        } else {
          Write-Host "Running tests..." -ForegroundColor Cyan
          dotnet test --no-build --verbosity normal --configuration Release
        }
      working-directory: .
      continue-on-error: true
      
    - name: Publish
      shell: powershell
      run: |
        Write-Host "Publishing application..." -ForegroundColor Cyan
        dotnet publish --configuration Release --output "${{ env.PUBLISH_PATH }}" --no-build
      working-directory: .
      
    - name: Stop IIS App Pool
      shell: powershell
      run: |
        Import-Module WebAdministration
        Write-Host "Stopping App Pool: ${{ env.IIS_APP_POOL }}" -ForegroundColor Cyan
        
        if (Test-Path "IIS:\AppPools\${{ env.IIS_APP_POOL }}") {
          $state = (Get-WebAppPoolState -Name "${{ env.IIS_APP_POOL }}").Value
          Write-Host "Current state: $state"
          
          if ($state -eq "Started") {
            Stop-WebAppPool -Name "${{ env.IIS_APP_POOL }}"
            Start-Sleep -Seconds 5
            Write-Host "App Pool stopped successfully" -ForegroundColor Green
          } else {
            Write-Host "App Pool was already stopped"
          }
        } else {
          Write-Host "App Pool not found - will be created on first deployment" -ForegroundColor Yellow
        }
        
    - name: Backup Previous Deployment
      shell: powershell
      run: |
        $destination = "${{ env.IIS_PHYSICAL_PATH }}"
        $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
        $backupPath = "C:\Backups\PresupuestoApp_$timestamp"
        
        if (Test-Path $destination) {
          Write-Host "Creating backup at: $backupPath" -ForegroundColor Cyan
          New-Item -Path "C:\Backups" -ItemType Directory -Force | Out-Null
          Copy-Item -Path $destination -Destination $backupPath -Recurse -Force
          Write-Host "Backup created successfully" -ForegroundColor Green
          
          $oldBackups = Get-ChildItem "C:\Backups" | Where-Object {
            $_.Name -like "PresupuestoApp_*" -and $_.CreationTime -lt (Get-Date).AddDays(-7)
          }
          
          if ($oldBackups) {
            $oldBackups | Remove-Item -Recurse -Force
            Write-Host "Cleaned up $($oldBackups.Count) old backup(s)" -ForegroundColor Green
          }
        } else {
          Write-Host "No previous deployment found, skipping backup" -ForegroundColor Yellow
        }
        
    - name: Deploy to IIS
      shell: powershell
      run: |
        $source = "${{ env.PUBLISH_PATH }}\*"
        $destination = "${{ env.IIS_PHYSICAL_PATH }}"
        
        Write-Host "Deploying from: ${{ env.PUBLISH_PATH }}" -ForegroundColor Cyan
        Write-Host "Deploying to: $destination" -ForegroundColor Cyan
        
        New-Item -Path $destination -ItemType Directory -Force | Out-Null
        
        Write-Host "Copying files..." -ForegroundColor Cyan
        Copy-Item -Path $source -Destination $destination -Recurse -Force
        Write-Host "Files deployed successfully" -ForegroundColor Green
        
        $criticalFiles = @(
          "PresupuestoFamiliarApp.dll",
          "web.config",
          "appsettings.json"
        )
        
        Write-Host "Verifying critical files..." -ForegroundColor Cyan
        foreach ($file in $criticalFiles) {
          $filePath = Join-Path $destination $file
          if (Test-Path $filePath) {
            Write-Host "  [OK] $file" -ForegroundColor Green
          } else {
            Write-Host "  [MISSING] $file" -ForegroundColor Red
          }
        }
        
    - name: Set Permissions
      shell: powershell
      run: |
        $path = "${{ env.IIS_PHYSICAL_PATH }}"
        
        Write-Host "Setting permissions on: $path" -ForegroundColor Cyan
        
        icacls $path /grant "IIS AppPool\${{ env.IIS_APP_POOL }}:(OI)(CI)RX" /T | Out-Null
        Write-Host "Read/Execute permissions set for App Pool" -ForegroundColor Green
        
        $wwwrootPath = Join-Path $path "wwwroot"
        if (Test-Path $wwwrootPath) {
          icacls $wwwrootPath /grant "IIS AppPool\${{ env.IIS_APP_POOL }}:(OI)(CI)M" /T | Out-Null
          Write-Host "Write permissions set for wwwroot" -ForegroundColor Green
        }
        
        $logsPath = Join-Path $path "logs"
        New-Item -Path $logsPath -ItemType Directory -Force | Out-Null
        icacls $logsPath /grant "IIS AppPool\${{ env.IIS_APP_POOL }}:(OI)(CI)M" /T | Out-Null
        Write-Host "Logs directory created and permissions set" -ForegroundColor Green
        
    - name: Start IIS App Pool
      shell: powershell
      run: |
        Import-Module WebAdministration
        Write-Host "Starting App Pool: ${{ env.IIS_APP_POOL }}" -ForegroundColor Cyan
        
        if (Test-Path "IIS:\AppPools\${{ env.IIS_APP_POOL }}") {
          Start-WebAppPool -Name "${{ env.IIS_APP_POOL }}"
          Start-Sleep -Seconds 5
          
          $state = (Get-WebAppPoolState -Name "${{ env.IIS_APP_POOL }}").Value
          Write-Host "App Pool state: $state" -ForegroundColor Cyan
          
          if ($state -eq "Started") {
            Write-Host "App Pool started successfully" -ForegroundColor Green
          } else {
            Write-Host "WARNING: App Pool state is: $state" -ForegroundColor Yellow
          }
        } else {
          Write-Host "WARNING: App Pool not found - please configure IIS manually" -ForegroundColor Yellow
        }
        
    - name: Verify Deployment
      shell: powershell
      run: |
        Import-Module WebAdministration
        
        Write-Host "Verifying deployment..." -ForegroundColor Cyan
        
        if (Test-Path "IIS:\AppPools\${{ env.IIS_APP_POOL }}") {
          $poolState = (Get-WebAppPoolState -Name "${{ env.IIS_APP_POOL }}").Value
          Write-Host "App Pool State: $poolState" -ForegroundColor Cyan
          
          if ($poolState -ne "Started") {
            Write-Host "WARNING: App Pool is not started" -ForegroundColor Yellow
          }
        }
        
        if (Test-Path "IIS:\Sites\${{ env.IIS_SITE_NAME }}") {
          $siteState = (Get-WebsiteState -Name "${{ env.IIS_SITE_NAME }}").Value
          Write-Host "Website State: $siteState" -ForegroundColor Cyan
        }
        
        Write-Host ""
        Write-Host "Testing HTTP response..." -ForegroundColor Cyan
        try {
          $response = Invoke-WebRequest -Uri "http://presupuesto.gestionaminegocio.com" -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop
          
          if ($response.StatusCode -eq 200) {
            Write-Host "Application is responding (HTTP 200 OK)" -ForegroundColor Green
          } else {
            Write-Host "Application returned status: $($response.StatusCode)" -ForegroundColor Yellow
          }
        } catch {
          Write-Host "Could not reach application: $($_.Exception.Message)" -ForegroundColor Yellow
          Write-Host "The application may still be starting up or DNS not configured" -ForegroundColor Yellow
        }
        
        Write-Host ""
        Write-Host "================================================" -ForegroundColor Green
        Write-Host "   DEPLOYMENT COMPLETED SUCCESSFULLY!" -ForegroundColor Green
        Write-Host "================================================" -ForegroundColor Green
        Write-Host "Deployed to: ${{ env.IIS_PHYSICAL_PATH }}"
        Write-Host "App Pool: ${{ env.IIS_APP_POOL }}"
        Write-Host "Website: ${{ env.IIS_SITE_NAME }}"
        Write-Host "URL: http://presupuesto.gestionaminegocio.com"
        Write-Host "================================================" -ForegroundColor Green
        
    - name: Deployment Summary
      if: always()
      shell: powershell
      run: |
        Write-Host ""
        Write-Host "============================================"
        Write-Host "       DEPLOYMENT SUMMARY"
        Write-Host "============================================"
        Write-Host "Repository: ${{ github.repository }}"
        Write-Host "Branch: ${{ github.ref_name }}"
        Write-Host "Commit: ${{ github.sha }}"
        Write-Host "Commit Message: ${{ github.event.head_commit.message }}"
        Write-Host "Triggered by: ${{ github.actor }}"
        Write-Host "Deployment Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
        Write-Host "Target Path: ${{ env.IIS_PHYSICAL_PATH }}"
        Write-Host "Public URL: http://presupuesto.gestionaminegocio.com"
        Write-Host "============================================"